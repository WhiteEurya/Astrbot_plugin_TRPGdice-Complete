  help:
    index: |
      TRPG 骰子插件帮助
      示例统一用点号。可在插件配置中按行设置多个指令触发词，所有骰子指令共用；AstrBot 全局唤醒词也可用。
      分类帮助也接受 .help roll 或 .dicehelproll 这类写法。
      .dicehelp / .help / .bothelp : 打开帮助总目录。
      掷骰帮助 / .掷骰帮助 / /掷骰帮助 : 打开帮助总目录。
      .dicehelp roll / .help 掷骰 : 掷骰、CoC 检定、暗骰、SAN 和吸血鬼骰。
      .dicehelp expr : 重复掷骰、保留骰、重骰、爆炸骰和保底。
      .dicehelp pc : 建卡、切卡和跨群同步。
      .dicehelp st : 属性录入、查询、模板和导出。
      .dicehelp log : 群日志、导出和旁观者。
      .dicehelp coc : 切换规则、技能别名、机器人控制和杂项。
      .dicehelp dnd : DnD 人物卡、职业、资源、检定和先攻。
      .dicehelp <指令> / .help <指令> : 查询单条用法，例如 .dicehelp log export。
    pc: |
      CoC 与 DnD 的人物卡分开保存。DnD 职业、版本和资源见 .dicehelp dnd。
      .pc new <角色名> / .pc create <角色名> : 新建空白人物卡并绑定到当前会话。
      .pc list : 列出人物卡与序号，标出当前卡。
      .pc tag [角色名或序号] / .pc change [角色名或序号] : 切换当前人物卡；省略参数时解除绑定。
      .pc show [角色名或序号] : 查看当前或指定的人物卡。
      .pc update <属性表达式> : 按 .st 的格式录入或修改当前卡属性，例如 .pc update 幸运+1。
      .pc rename <新名字> : 重命名当前人物卡。
      .pc del <角色名或序号> / .pc delete <角色名或序号> : 删除指定人物卡。
      .pc push : 上传当前卡至跨群档案库。
      .pc push global : 标记为全局卡，让已绑定全局卡的群使用同一份档案。
      .pc push local : 取消全局卡模式，恢复本群独立副本。
      .pc fetch : 列出跨群档案及其序号。
      .pc pull <序号> [global] : 按 .pc fetch 的序号拉取并绑定。加 global 可绑定为全局卡。
    st: |
      先用 .pc new 建卡或 .pc tag 绑定人物卡。DnD 的专用录入示例见 .dicehelp dnd。
      .st template / .st 模板 : 获取当前规则的录入模板。
      .st <属性表达式> : 设置或修改属性。CoC 示例：.st 侦查60、.st 幸运+1、.st 幸运3d6、.st 力量60敏捷55。
      .st show [属性名] : 省略参数时查看人物卡属性；可指定一项或多项。群里可 @ 目标查询其当前卡。
      .st show <数字> : CoC 下筛选严格大于该数字的属性，例如 .st show 50。
      .st del <属性名> : 删除指定属性。
      .st clr : 清除可清理的属性。DnD 会保留核心属性。
      .st export : 导出可重新录入的属性表达式。
    dice: |
      裸 .r 使用当前默认骰。CoC 为 1d100，DnD 为 1d20。普通掷骰支持群聊和私聊。
      群里的 .ra、.rab、.rap、.rau、.en、暗骰和 .rv 依赖 OneBot 接口。
      .r [骰式] [备注] : 投掷数值骰，例如 .r1d20+5 攻击；!r 同样可用。
      .rd<面数> : 单颗指定面数骰的短写，例如 .rd20 等同于 .r1d20。
      .rh [骰式] : 暗骰。OneBot 群里只发提示，骰点私聊给发起者；私聊中直接回复结果。
      .adv[修正] / .advantage[修正] : 掷两颗当前默认面数的骰并取高，例如 .adv+3。
      .dis[修正] / .disadvantage[修正] : 掷两颗当前默认面数的骰并取低，例如 .dis-2。
      .ra <技能名> [数值] / .rc <技能名> [数值] : CoC 技能检定，例如 .ra侦查50。省略数值时读取人物卡或常见技能默认值。
      .ra h<技能名> / .ra e<技能名> : CoC 困难／极难检定，也可写 .ra困难侦查50 或 .ra极难侦查50。
      .rab [数量] <技能名> [数值] / .rb [数量] <技能名> [数值] : CoC 奖励骰，例如 .rab2射击50；.rcb 也可用。
      .rap [数量] <技能名> [数值] / .rp [数量] <技能名> [数值] : CoC 惩罚骰，例如 .rap2射击50；.rcp 也可用。
      .rah <技能名> [数值] / .rch <技能名> [数值] / .hl <技能名> [数值] : CoC 暗中检定，群里将点数私发给发起者。
      .rau <技能名> [数值] : CoC 连续检定直到成功或达到上限，最多显示前 10 次骰点。
      .rav <技能名>a<己方>/b<对方> / .rcv <技能名>a<己方>/b<对方> : CoC 对抗，例如 .rav斗殴a60/b50。可省略 a60 从当前卡读取己方数值；群里也可发送 .rav 斗殴 并 @ 对手。
      .en <技能名> [数值] : CoC 技能成长检定，例如 .en 侦查。
      .sc <成功扣除>/<失败扣除> : CoC 理智检定，写回当前人物卡，例如 .sc 0/1d6。
      .ti : 抽取临时疯狂症状。
      .li : 抽取长期不定性疯狂症状。
      .fire [模式] [技能值] [+pN/+bN] : CoC 三次手枪检定。accuracy（默认）为 1/1/1 惩罚骰，normal 为 0/0/0，recoil 为 0/1/2。首项 p1、p2 兼容旧写法。示例 .fire recoil 60 +b1；省略技能值时读取手枪技能，缺省 20。只检定，不算伤害。
      .rv [骰数] [难度] : OneBot 群聊吸血鬼规则掷骰，默认 1 颗 d10、难度 6，例如 .rv 5 6。
    expr: |
      这些骰式用在 .r 后面。示例同时展示有空格和无空格的实际写法。
      .r <算式> : 支持四则运算与括号，例如 .r (2d6+3)*2。
      .r <次数>#<骰式> : 重复投掷，例如 .r 3#1d10。
      .r <数量>#b / .r <数量>#p : CoC 的 d100 奖励／惩罚骰，例如 .r 2#b。
      .ra<次数>#b<数量><技能名><数值> : 重复 CoC 奖励骰检定，例如 .ra3#b2射击50。
      .ra<次数>#p<数量><技能名><数值> : 重复 CoC 惩罚骰检定，例如 .ra3#p2射击50。
      .r <骰组>k<保留数> : .r4d6k3 保留最高 3 个；.r4d6k-2 保留最低 2 个。
      .r <骰组>rh : 同一骰组掷两次取较高总值，例如 .r2d6rh+5 或 .r(2d6+1d8)rh。
      .r <骰组>![追加上限] : 掷到满点追加骰，可连锁，例如 .r2d6!3；省略上限时默认最多追加 5 颗。
      .brust<骰组>[,追加上限] : 爆炸骰短写，例如 .brust8d6,5 等同于 .r8d6!5。
      .r <骰组>min<下限>max<上限> : 限制每颗骰子的点数，例如 .r3d20min10max15；min 和 max 可单独使用。
      .r <算式>>=<下限> : 提高最终结果的最低值，例如 .r1d20+5>=15 的结果至少为 15。
    log: |
      日志和旁观者按群管理。日志名请用不带空格的单个名称。
      .log new [日志名] : 新建并开始记录；省略名称时使用自动编号。
      .log off : 暂停当前日志。
      .log on [日志名] : 继续指定日志；省略名称时恢复最近暂停的日志。
      .log end : 结束当前日志。
      .log list : 查看本群日志列表。
      .log stat [日志名] : 查看消息、参与者、骰点、旁观者和图片数；留空优先显示当前日志。
      .log get <日志名> / .log export <日志名> : 导出 JSON 并返回染色器链接。
      .log export text <日志名> / .log export txt <日志名> : 在服务器上生成纯文本日志，回复文件名。
      .log del <日志名> : 删除指定日志。
      .ob : 切换自己的旁观者状态。
      .ob list / .ob ls / .log ob / .log ob list / .log ob ls : 查看本群旁观者名单。
      .log ob add <QQ号或@用户> : 将目标加入本群旁观者名单。
      .log ob del <QQ号或@用户> / .log ob remove <QQ号或@用户> / .log ob rm <QQ号或@用户> : 从本群旁观者名单移除目标。
      .log ob clear : 清空本群旁观者名单。
    coc: |
      .ruleset [coc 或 dnd] / .setrule [coc 或 dnd] / .system [coc 或 dnd] : 查看或切换当前会话规则。CoC 默认 1d100，DnD 默认 1d20。
      .setcoc [编号] : 切回 CoC 并查看或设置大成功／大失败规则；1～4 为规则编号，0 恢复默认。
      .coc [数量] : 生成 1～10 组 CoC 人物属性，默认 1 组，也可写 .coc3。
      .alias add <别名> <技能名> : 为自己的 CoC 技能增加别名。
      .alias list : 列出自己的技能别名。
      .alias del <别名> : 删除指定技能别名。
      .取名 [国籍 数量 性别] / .name [国籍 数量 性别] : 随机取名，例如 .取名 中国 5。默认 5 个中国名；启用 LLM 取名时可输入自然语言。
      .d66 [次数] : 用两颗 d6 分别作为十位和个位。默认 1 次，最多 20 次。
      .jrrp : 查询今日人品。
      .choose <选项…> / .choice <选项…> : 随机选择一个选项，例如 .choose 苹果 / 梨 / 葡萄。
      .find <法术名> [版本] : 查询 DnD 或 CoC 法术。DnD 旧版可指定 2014、5e 或 旧版，例如 .find 火球术 2014；CoC 可用 .find coc <法术名>。
      .sn [模式] / .nn [模式] : 更新 OneBot 群名片。coc 为默认，cocL 增加 MP，none 只用角色名，off 清空名片。DnD 卡默认显示 HP、AC 与 DC。
      .bot / .bot status : 查看骰子信息或状态。关闭后仅 .bot on 和 .bot quit 可用。
      .bot off / .bot on : 在当前群关闭或开启骰子；多机器人同群时可 @ 指定机器人。
      .bot quit : 通过 OneBot 接口退出当前群。
      .挂团 : 在群里获取当前规则的挂团模板并等待填写；发布群公告需要机器人具备 OneBot 群管理员权限。
      .挂团 list / .挂团 列表 / .挂团 查看 : 查看当前群的挂团公告列表。
      .挂团 del <编号> / .挂团 delete <编号> / .挂团 删除 <编号> : 从插件的挂团列表移除指定记录。
    dnd: |
      人物卡检定和资源操作需要先切换到 DnD 并绑定人物卡。
      .ruleset dnd : 切换当前会话到 DnD；用 .pc new <角色名> 建卡。
      .dnd [数量] : 生成 1～10 组 DnD 角色属性，默认 1 组，也可写 .dnd3。
      .st 力量:8 敏捷:18 智力*:14 感知*:19 熟练:3 察觉*:0 奥秘*:4 : 录入简化卡。属性星号表示豁免熟练；技能数值是额外修正。
      .st show [属性、技能或豁免] : 查看属性和计算后的加值，也可用 .st show 资源。
      .st template / .st 模板 : 获取 DnD 卡模板。
      .st export : 导出简化卡，保留星号与额外修正。
      .st hp-7 / .st hp+5 / .st thp:6 : 伤害先扣临时 HP；治疗最多到 hpmax。
      .st 等级:5 / .st lv:5 / .st 等级+1 : 设置或增加总等级（1～20）；有职业记录时用 .pc class 修改等级。
      .pc class / .pc 职业 : 查看当前卡的职业。
      .pc class help / .pc 职业 帮助 : 查看职业录入与管理用法。
      .pc class <职业表达式> : 例如 .pc class 战士:3/法师:2、.pc class 战士(战斗大师@2024):5。首项为起始职业，可为各职业或子职分别标来源。
      .pc class list [职业或来源] : 查询子职目录，例如 .pc class list 战士、.pc class list 武僧 2024 或 .pc class list 塔莎。
      .pc class clear : 清除职业记录并保留总等级；也接受 clr 和 清除。
      .pc version [2014 或 2024] / .pc 版本 [2014 或 2024] : 查看或设置人物卡的资源规则版本。
      .res / .resource / .资源 / .pc res / .pc resource / .pc 资源 : 查看法术位与职业资源，也可用 .res show 或 .res 查看。
      .res help / .res 帮助 : 查看资源管理与动态上限用法。
      .res init <2014 或 2024> : 初始化资源版本。已有其他版本时不会通过此指令切换。
      .res <资源名> [数量] / .res use <资源名> [数量] : 消耗资源。例如 .res 一环、.res 契约或 .res 术法点-2；数量默认 1。
      .res recover <资源名> [数量] : 补回资源，例如 .res recover 术法点 2 或 .res 术法点+2。
      .res add <资源名> <上限> [恢复方式] : 登记自定义资源，例如 .res add 灵能点 5 长休。支持动态上限（如 =2*pb），恢复方式为短休、长休、皆有或手动。
      .res del <资源名> : 删除指定的自定义资源。
      .res 短休 / .res 长休 / .res rest <short 或 long> : 按规则恢复资源，不修改 HP。
      .rc <技能、属性或豁免> : 按当前卡计算检定。例如 .rc 察觉、.rc 力量、.rc 智力豁免或 .rc*智。
      .rc 优势 <技能> / .rc 劣势 <技能> : 优势／劣势检定。短写如 .rcb隐匿+2、.rcp察觉、.rcb*敏、.rcp*体。
      .rc <次数>#<技能> : 重复检定，例如 .rc3#察觉 或 .rc*3#智；末尾可加临时修正或保底，如 .rc 察觉+2>=15。
      .ri [修正或点数] [角色名] : 群内加入先攻。裸 .ri 读取当前卡先攻；.ri +4 掷 1d20+4；.ri 18 艾琳 直接登记先攻 18。
      .init : 查看先攻列表。
      .init clr : 清空先攻列表。
