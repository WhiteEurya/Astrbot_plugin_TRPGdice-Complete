    temporary:
      "1": "失忆：调查员只记得最后身处的安全地点，却没有任何来到这里的记忆。这将会持续 1D10 轮。"
      "2": "假性残疾：调查员陷入心理性的失明、失聪或躯体缺失感，持续 1D10 轮。"
      "3": "暴力倾向：调查员对周围所有人展开攻击，持续 1D10 轮。"
      "4": "偏执：调查员陷入严重的偏执妄想，持续 1D10 轮。"
      "5": "人际依赖：调查员误认为某人是自己的重要之人，并据此行动，持续 1D10 轮。"
      "6": "昏厥：调查员当场昏倒，1D10 轮后苏醒。"
      "7": "逃避行为：调查员试图逃离当前场所，持续 1D10 轮。"
      "8": "歇斯底里：调查员陷入极端情绪，持续 1D10 轮。"
      "9": "恐惧：骰 1D100 或由守秘人选择一个恐惧症，持续 1D10 轮。"
      "10": "躁狂：骰 1D100 或由守秘人选择一个躁狂症，持续 1D10 轮。"
    long_term:
      "1": "失忆：调查员发现自己身处陌生地方，并忘记自己是谁。"
      "2": "被窃：调查员 1D10 小时后清醒，发现贵重物品丢失。"
      "3": "遍体鳞伤：调查员 1D10 小时后清醒，身体有严重伤痕。"
      "4": "暴力倾向：调查员可能在疯狂期间杀人或造成重大破坏。"
      "5": "极端信念：调查员疯狂地执行某个信仰并采取极端行动。"
      "6": "重要之人：调查员疯狂追求某个在意的人，不顾一切地接近。"
      "7": "被收容：调查员在精神病院或警察局醒来，完全不记得发生了什么。"
      "8": "逃避行为：调查员在远离原地点的地方醒来，可能身处荒郊野外或陌生城市。"
      "9": "恐惧：调查员患上一种新的恐惧症（骰 1D100 或由守秘人选择）。"
      "10": "躁狂：调查员患上一种新的躁狂症（骰 1D100 或由守秘人选择）。"
    check_result:
