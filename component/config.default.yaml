  help:
    index: |
      TRPG 骰子插件帮助
      基础掷骰教程：.dicehelp roll
      进阶掷骰表达式：.dicehelp expr
      人物卡管理：.dicehelp pc
      属性值管理：.dicehelp st
      记录管理：.dicehelp log
      其余杂项指令：.dicehelp coc
      DnD 相关：.dicehelp dnd
      其他规则：
      `/rv 骰子数量 难度` - 进行吸血鬼规则掷骰判定
    pc: |
      角色管理
      .pc new <角色名> : 创建空白人物卡，并绑定为当前人物卡。
      .pc create <角色名> : 与 .pc new 相同，兼容 Dice! 习惯写法。
      .pc tag [<角色名> | <角色序号>] : 将对应人物卡绑定为当前人物卡。
      .pc change [<角色名> | <角色序号>] : 与 .pc tag 相同，兼容 Dice! 习惯写法。
      .pc tag [不加参数] : 解除当前群组的人物卡绑定。
      .pc list : 列出已保存的人物卡及其序号。
      .pc show [<角色名> | <角色序号>] : 查看指定人物卡，不切换当前绑定。
      .pc update <属性表达式> : 与 .st <属性表达式> 相同，兼容 Dice! 习惯写法。
      .pc rename <新名字> : 重命名当前人物卡。
      .pc del <角色名|序号> : 删除指定人物卡。
      .pc push : 上传当前人物卡，覆盖已有档案。
      .pc push global : 当前群使用全局档案，跨群修改同步至同一份人物卡。
      .pc push local : 当前群使用隔离的本地副本，修改不影响全局档案。
      .pc fetch : 查看跨群人物卡列表。
      .pc pull : 拉取人物卡至当前群组。
      .pc pull <序号> global : 将指定人物卡作为全局卡绑定至当前群组。
    st: |
      属性记录
      .st <属性><数值> : 设置属性数值。
      .st <属性><+|-><数值> : 增加或减少属性数值。
      .st <属性><骰子表达式> : 掷骰并将结果写入属性。
      .st <录入表达式> : 批量录入属性，可使用 CoC 人物卡的简化卡表达式。
      .st show : 查看全部属性。
      .st show <属性名> : 查看指定属性。
      .st show <数字> : 查看大于指定数值的属性。
      .st del <属性名> : 删除指定属性。
      .st clr : 清空可清理的属性。
      .st export : 导出可用于录入的属性表达式。
    dice: |
      .fire [normal/accuracy/recoil] [技能值] [+pN/+bN]：三次手枪检定；默认 accuracy（1/1/1 惩罚骰），normal 为 0/0/0，recoil 为 0/1/2。首个 p1/p2 兼容旧模式 accuracy/recoil；自定义修正推荐写 +pN（增加惩罚）或 +bN（增加奖励），每项 0～10 个，可叠加并相抵。例如 .fire recoil 60 +b1 → 1奖励/无/1惩罚；.fire normal 5 +p2 → 每发2惩罚。技能值 0～999；省略时读取人物卡手枪技能，无记录默认20。只检定，不计算伤害。
      检定与掷骰
      .r <表达式> : 投掷指定骰式并显示结果。
      .adv[+/-修正] : DnD 优势检定，例如 .adv+3
      .dis[+/-修正] : DnD 劣势检定，例如 .dis-2
      .ra <技能名> [数值（可选）] : 进行技能检定，省略数值时读取人物卡。
      .ra h技能名 / .ra e技能名 : 困难/极难检定短写，也可以继续写“困难技能名”“极难技能名”。
      .rau <技能名> [数值（可选）] : 连续检定直到成功，输出总次数和前10次结果。
      .rav <技能名>a<点数>/b<点数> : 进行对抗检定；a点数可省略，省略时读取自己的角色卡技能值。
      .rav <技能名> @对抗者 : 使用双方当前角色卡中的同名技能进行对抗检定。
      .rab [数量] <技能名> [数值（可选）] : 进行奖励骰检定，选择最小的十位结果。
      .rap [数量] <技能名> [数值（可选）] : 进行惩罚骰检定，选择最大的十位结果。
      .alias add <别名> <技能名> : 设置自己的技能别名；.alias list 查看，.alias del <别名> 删除。
      .ruleset [coc/dnd] : 切换本群规则系统；CoC 下 .r 默认 1d100，DnD 下 .r 默认 1d20。
      .bot : 查看骰子信息；.bot off / .bot on / .bot status 可关闭、开启或查看本群骰子响应状态。
      .bot quit : 退出当前群聊。
      未填写的 COC 常见技能会自动使用默认值，例如侦查25、图书馆20、闪避=敏捷/2；艺术/科学/外语/生存等专业技能也会识别括号内容。
      Dice! 兼容短写：!r、.rb、.rp、.hl、.nn 也可以直接使用。
      进阶骰式用法：.dicehelp expr
      .sc <成功扣除>/<失败扣除> : 进行 SAN 检定并扣除理智。
      .ti : 抽取临时疯狂症状。
      .li : 抽取长期不定性疯狂症状。
      .en <技能名> : 进行技能成长检定。
      .rh <表达式> : 暗骰，结果发送至私聊。
    expr: |
      单骰上下限：.r 3d20min10max15，每颗限制在10到15；可与k、加值及>=结果下限组合。
      结果下限：.r 1d20+5>=15，完整结果不低于15；.r (1d20>=10)+5 先保底再加值。
      支持重复、暗骰、保留高低骰；DnD 可用 .rc 察觉>=15，天然1/20按原始骰点判断。
      .r <算式>。如：1d6+5/2d6*3/(1d6+2)*3
      .r <次数>#<表达式>。如：.r 3#1d10，连续掷3次1d10。
      .ra <次数>#b<技能名>。如：.ra3#b2射击50，连续进行3次射击检定，每次带2个奖励骰。
      .ra <次数>#p<技能名>。如：.ra3#p2射击50，连续进行3次射击检定，每次带2个惩罚骰。
      .r <总数>d<面数>k<保留数>。如：.r4d6k3 保留最高的3个；.r4d6k-2 保留最低的2个。
    log: |
      日志管理
      .log new <故事名> : 新建日志并开始记录。
      .log end : 结束当前日志。
      .log on [故事名] : 开始或继续记录指定日志，留空使用最近的日志。
      .log off : 暂停记录当前日志。
      .log list : 查看日志列表。
      .log get <故事名> : 获取指定日志。
      .log stat <故事名> : 查看消息及参与者等统计。
      .log del <故事名> : 删除指定日志。
    coc: |
      CoC 与杂项设置
      .setcoc : 查看或设置 CoC 检定规则，并把本群规则系统切回 CoC。
      .ruleset [coc/dnd] : 查看或切换本群规则系统。
      .coc <数目> : 生成指定数量的 CoC 人物属性。
      .name <cn/en/us/jp> : 按地区随机生成姓名。
      .d66 [次数] : 掷一次或多次 D66。
      .find <名称> : 查询海豹内置资料中的 DND/COC 法术；未命中时会回退到 SRD 或开放神话仪式摘要。
      .choose <选项A> <选项B> ... : 随机选择一个选项，也支持用 /、|、逗号分隔。
      .挂团 : 开始填写挂团模板；.挂团 list 查看当前公告；.挂团 del <编号> 删除公告。
    dnd: |
      `.ruleset dnd` - 使用独立的 DnD 人物卡；.pc new <名字> 创建人物卡
      `.st 力量:8 敏捷:18 智力*:14 感知*:19 熟练:3 察觉*:0 奥秘*:4` - 录入简化卡；属性星号是豁免熟练，技能数值是额外修正
      `.st show [属性/技能/属性豁免]` - 查看属性和计算后的加值；奥秘*:4 在本例中最终为 +9
      `.st template / .st 模板` - 获取 DnD 模板
      `.st export` - 导出简化卡，保留星号和额外修正
      `.st hp-7 / .st hp+5 / .st thp:6` - 伤害先扣临时 HP，治疗不超过 hpmax
      `.st del <属性> / .st clr` - 清理非核心属性，保留六维、HP 和熟练加值
      `.rc 察觉 / .rc 智力豁免 / .rc 力量` - 技能、豁免和属性检定
      `.rc*智 / .rcb隐匿+2 / .rcp察觉 / .rc3#察觉` - 豁免、优势、劣势和重复检定的短写
      `.rcb*敏 / .rcp*体 / .rc*3#智` - 优势豁免、劣势豁免、重复豁免；属性支持单字或全称
      `.sn / .nn` - 按当前规则更新 QQ 群名片，显示 HP、临时 HP、AC、DC；属性保存后自动刷新
      `.st 等级:5 / .st lv:5 / .st 等级+1` - 设置或增加总等级（1-20）；不自动修改熟练、HP 或 DC
      `.pc class 战士:3/法师:2` - 设置职业及兼职，第一项为起始职业；总等级自动求和，有职业记录时升级请修改职业明细
      `.pc class 奥法骑士:3/法师:2` - 特殊子职可直接录入；其他子职可写 战士(子职):3
      `.pc class / .pc class list / .pc class clear` - 查看职业、查看支持说明、清除职业记录但保留总等级
      `.pc class list 战士 / .pc class list 武僧 2024 / .pc class list 塔莎` - 按职业或来源查询官方子职目录
      `.pc class 战士(战斗大师@2024):5` - 指定子职来源；同名多版本不自动选版
      `.pc class 战士@2024:5/法师(剑咏@塔莎):3` - 仅有差异的项目标来源；可混合来源，不需要整卡选版本
      `.res / .st show 资源` - 自动计算并查看普通环位、契约位及职业资源余额
      `.res 一环 / .res 契约 / .res 术法点 2` - 扣除资源，次数默认 1；不足不扣
      `.res recover 术法点 2` - 补回指定数量，不超过上限
      `.res 短休 / .res 长休` - 数据库自动决定恢复量与次数限制，不修改 HP；有差异但缺来源的项目提示补录，不阻断其他资源
      `.rc 优势 隐匿 / .rc 劣势 察觉 / .rc 3# 察觉+2` - 优势、劣势、重复检定、临时修正；支持 @代投
      `.ri` - 读取人物卡先攻加值和名字；没有先攻时读取敏捷调整值
      `.dnd x` - 生成 x 个 DnD 角色属性
      `.find 火球术` - 查询 DND/COC 法术资料
      `.init` - 显示当前先攻列表
      `.init clr` - 清空先攻列表
      `.init del [角色名]` - 删除角色先攻（默认为用户名）
      `.ri +/- x` - 以 x 的调整值投掷先攻
      `.ri x [角色名]` - 将角色（默认为用户名）的先攻设置为 x
      `.ed` - 结束当前回合
      `.fireball n` - 施放 n 环火球术，计算伤害
      `.bot quit` - 退出当前群聊
  setting:
    website: "https://painter.velinithra.space"
